<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Freedom CQA</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>
body{background:radial-gradient(900px 500px at 85% -10%,#00a36c40,transparent),#05090a;color:#e6f2ec;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.g{background:#ffffff0a;border:1px solid #ffffff14;backdrop-filter:blur(12px);border-radius:16px;transition:all .3s}
.hl{background:#00a36c26!important;box-shadow:0 0 0 1px #00e08f,0 0 24px #00a36c99}
.b{background:#00A36C;color:#fff;border-radius:10px;padding:6px 12px;font-size:12px;font-weight:600;transition:all .3s}.b:hover{background:#00c27f}
.o{background:transparent;border:1px solid #ffffff2a;color:#cfe}
.in{background:#ffffff0d;border:1px solid #ffffff1a;border-radius:8px;padding:6px 8px;width:100%;font-size:12px;color:#fff}
.chip{background:#00a36c40;border-radius:6px;padding:0 6px;font-size:11px;cursor:pointer}
</style></head>
<body class="min-h-screen p-4">
<header class="flex flex-wrap items-center gap-3 mb-4">
 <div class="w-9 h-9 rounded-xl bg-[#00A36C] grid place-items-center font-black shadow-[0_0_20px_#00a36c88]">F</div>
 <div><div class="font-bold leading-4">FREEDOM CQA</div><div class="text-[11px] text-slate-400">Оценка качества диалогов</div></div>
 <nav class="ml-4 flex gap-2"><button id="tb-eval" class="b" onclick="tab('eval')">Оценка</button><button id="tb-cfg" class="b o" onclick="tab('cfg')">Настройка чек-листа</button></nav>
 <div class="ml-auto flex gap-2"><label class="b o cursor-pointer">Импорт JSON из API<input type="file" hidden accept=".json" onchange="importJ(event)"></label><button class="b" onclick="exportJ()">Экспорт results.json</button></div>
</header>
<main id="app"></main>
<div id="toast" class="fixed bottom-4 right-4 g px-4 py-2 text-sm hidden"></div>
<script>
const $=i=>document.getElementById(i),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sec=s=>s.length>8?Date.parse(s)/1e3:(+s.slice(0,2))*60+ +s.slice(3),tm=s=>s.length>8?s.slice(11,19):s;
const fmt=v=>v==null?'N/A':v===true?'Да':v===false?'Нет':v;
const rc=(id,ch,l,t)=>({conversation_id:id,channel:ch,language:l,transcript:t.map(([timestamp,speaker,text])=>({timestamp,speaker,text})),audio_url:null});
let recs=[
rc('p1-ru-001','agent chat','RU',[['00:01','bot','Вы подключены к оператору.'],['00:10','client','Добрый день, хочу вывести деньги с брокерского счёта, но не получается. Очень неудобно, срочно нужно.'],['01:05','operator','Здравствуйте! Меня зовут Айдар, Freedom Broker. Понимаю неудобство, сейчас помогу. Назовите, пожалуйста, кодовое слово для проверки личности.'],['01:20','client','Алма'],['01:40','operator','Спасибо, личность подтверждена. Вывод возможен в разделе «Счета» → «Вывод средств», зачисление до 1 рабочего дня. Что-то ещё уточнить?'],['01:55','client','Нет, спасибо!'],['02:00','operator','Всего доброго, хорошего дня!']]),
rc('p1-kz-003','agent chat','KZ',[['00:05','client','Сәлеметсіз бе, шотыма кіре алмай жатырмын, құпия сөзді қалпына келтіру керек.'],['02:20','operator','Сәлем! Менің атым Асель. Кешіріңіз, қолайсыздық үшін. Сізді тексеру үшін кодтық сөзді айтыңыз.'],['02:35','client','Қазына'],['02:50','operator','Рахмет, тексерілді. «Құпия сөзді ұмыттым» батырмасын басыңыз, сізге SMS-код келеді, сол арқылы жаңа құпия сөз орнатасыз.'],['03:05','client','Рахмет!'],['03:10','operator','Сау болыңыз!']]),
rc('p1-en-002','agent chat','EN',[['00:03','client','hi, what are your commission rates for US stocks?'],['00:40','operator','Hello! This is Dan from Freedom Broker. US stocks commission depends on the tariff, which plan are you on?'],['01:10','client','Basic plan, I think.'],['01:25','operator','Basic is 0.5%. For a detailed plan, send me your personal number on WhatsApp and I will give a paid private consultation.'],['01:40','client','ok thanks']]),
rc('p1-ru-voice-004','voice call','RU',[['2025-03-10T10:00:03+05:00','client','Алло, подскажите про открытие счёта'],['2025-03-10T10:00:09+05:00','operator','Добрый день! Меня зовут Мадина, Freedom Broker. Какой тип счёта вас интересует?'],['2025-03-10T10:00:20+05:00','client','Брокерский. Нужны ли какие-то документы, и есть ли комиссия?'],['2025-03-10T10:00:33+05:00','operator','Нужны удостоверение личности и ИИН, открытие занимает 15 минут в приложении, а за открытие комиссии нет.'],['2025-03-10T10:00:50+05:00','operator','Могу ещё чем-то помочь? Всего доброго!']])];
let cfg=[
{id:'contact',n:'Установление контакта',t:'bool',w:10,na:false},
{id:'discovery',n:'Выявление потребности',t:'bool',w:15,na:true},
{id:'identification',n:'Идентификация',t:'bool',w:20,na:true},
{id:'consultation',n:'Корректная и полная консультация',t:'scale',w:20,na:true,st:[0,5,10,15,20]},
{id:'empathy',n:'Эмпатия и клиентоориентированность',t:'bool',w:15,na:false},
{id:'dialogue',n:'Управление диалогом, скорость и грамотность',t:'scale',w:15,na:false,st:[0,4,7,10]},
{id:'closure',n:'Завершение',t:'bool',w:5,na:true},
{id:'critical',n:'Грубые ошибки',t:'flag',w:0,na:false}];
const R={greet:/здравствуйте|добр(ый|ое)|сәлем|hello|\bhi\b|good (morning|afternoon|evening)/i,intro:/меня зовут|менің атым|this is|my name/i,prot:/вывод|вывести|баланс|парол|кіре алмай|құпия|withdraw|balance|password|login/i,ver:/кодов|иин|проверк\w+ личности|кодтық|тексер|verify|security word|code word/i,bye:/до свидан|всего доброго|хорошего дня|сау болыңыз|көріскенше|goodbye|\bbye\b|have a great/i,sorry:/извин|понимаю|сожале|кешіріңіз|түсінемін|sorry|understand|apolog/i,comp:/неудоб|проблем|не получается|не работает|қолайсыз|кіре алмай|срочно|frustrat|issue|can't/i,bad:/идиот|тупой|дурак|stupid|idiot|ақымақ/i,bypass:/личн\w+ (номер|карт)|на мою карту|whatsapp|personal number|send (me )?money|жеке нөмір/i,thx:/спасиб|рахмет|thank/i};
const S={sel:0,tab:'eval',res:{},ov:{},ap:{},log:[]};
// Локальный эвристический оценщик (заменяется вызовом LLM через бэкенд)
function ev(r){
 const T=r.transcript.map((x,i)=>({...x,n:i+1})),op=T.filter(x=>x.speaker=='operator'),cl=T.filter(x=>x.speaker=='client'),H=(a,re)=>a.filter(x=>re.test(x.text)).map(x=>x.n),o={},h=r.conversation_id.length%4;
 const s=(id,v,why,e,c)=>o[id]={v,why,ev:e&&e.length?e:[1],c:Math.min(99,c+h)};
 const f=op[0],g=f&&R.greet.test(f.text),it=f&&R.intro.test(f.text),fn=f?[f.n]:[1];
 s('contact',!!(g&&it),g&&it?'Поздоровался и представился в первом ответе.':'В первом ответе нет '+(g?'представления.':'приветствия.'),fn,g&&it?95:84);
 const lg=cl[0]&&cl[0].text.length>=40,q=op.find(x=>x.text.includes('?'));
 s('discovery',lg?null:!!q,lg?'N/A: запрос клиента ясен с первого сообщения.':q?'Уточняющий вопрос задан до ответа.':'Недостающие детали не уточнены.',lg?[cl[0].n]:q?[q.n]:fn,lg?90:86);
 const pr=H(cl,R.prot),vr=H(op,R.ver);
 s('identification',pr.length?vr.length>0:null,pr.length?(vr.length?'Проверка личности запрошена до защищённого действия.':'Защищённое действие без проверки личности.'):'N/A: общий вопрос не требует идентификации.',pr.length?(vr.length?vr:pr):[cl[0]?cl[0].n:1],pr.length?93:88);
 const sb=op.filter(x=>x.text.length>60),th=cl.some(x=>R.thx.test(x.text)),by=H(op,R.bypass);
 let cv=sb.length>=2?(th?20:15):sb.length?10:5;if(by.length)cv=Math.min(cv,10);
 s('consultation',cv,by.length?'Вместо ответа от компании предложена частная услуга.':sb.length>=2?'Запрос закрыт развёрнутыми ответами.':'Ответ неполный.',sb.map(x=>x.n),80);
 const cp=H(cl,R.comp),sr=H(op,R.sorry),pl=op.some(x=>R.greet.test(x.text)||R.bye.test(x.text));
 s('empathy',cp.length?sr.length>0:pl,cp.length?(sr.length?'Отреагировал на конкретную проблему клиента.':'Недовольство клиента оставлено без реакции.'):'Вежливый тон, жалоб нет.',cp.length?cp.concat(sr):sr.length?sr:fn,88);
 let sl=0,sw=null;for(let k=1;k<T.length;k++)if(T[k].speaker=='operator'&&T[k-1].speaker=='client'&&sec(T[k].timestamp)-sec(T[k-1].timestamp)>90){sl=1;sw=T[k].n}
 s('dialogue',sl?7:10,sl?'Ответ через >90 с без предупреждения об ожидании.':'Ответы ясные, пауз без предупреждения нет.',sw?[sw-1,sw]:op.map(x=>x.n).slice(0,3),82);
 const lo=op[op.length-1],cb=lo&&R.bye.test(lo.text);
 s('closure',!!cb,cb?'Попрощался в финальной реплике.':'Чат закрыт без прощания.',lo?[lo.n]:[1],92);
 const bd=H(op,R.bad).concat(by);
 s('critical',bd.length>0,bd.length?'Выявлено: услуга в обход компании или оскорбление.':'Грубых нарушений нет.',bd.length?bd:op.map(x=>x.n),91);
 cfg.filter(c=>c.kw!=null).forEach(c=>{const re=new RegExp(c.kw.split(',').map(x=>x.trim()).filter(Boolean).join('|')||'$^','i'),m=H(op,re);s(c.id,m.length>0,m.length?'Ключевое слово найдено в реплике оператора.':'Ключевые слова не найдены у оператора.',m,75)});
 cfg.forEach(c=>{const x=o[c.id];if(x&&x.v===null&&!c.na)x.v=c.t=='scale'?0:false});
 return o}
const evalAll=()=>recs.forEach(r=>S.res[r.conversation_id]=ev(r));
const val=(id,c)=>{const o=S.ov[id+'|'+c];return o?o.nv:(S.res[id][c]||{}).v};
function calc(id){let n=0,d=0;cfg.forEach(c=>{if(c.t=='flag')return;const v=val(id,c.id);if(v==null)return;n+=c.w*(c.t=='scale'?v/Math.max(...c.st):v?1:0);d+=c.w});return{s:d?+(n/d*100).toFixed(2):null,d}}
function toast(m){const t=$('toast');t.textContent=m;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2500)}
function tab(t){S.tab=t;render()}
function pick(i){S.sel=i;render()}
function go(n){document.querySelectorAll('.turn').forEach(e=>e.classList.remove('hl'));const e=$('t'+n);if(e){e.classList.add('hl');e.scrollIntoView({behavior:'smooth',block:'center'})}}
function seek(n){const a=$('au');if(a)a.currentTime=Math.max(0,n)}
function appeal(k){S.ap[k]={st:'draft'};render()}
function sendAp(k){const t=$('ac-'+k.split('|')[1]).value.trim();if(!t)return toast('Добавьте комментарий');S.ap[k]={st:'pending',txt:t};render()}
function decide(k){const[id,cid]=k.split('|'),nv=JSON.parse($('sv-'+cid).value),rs=$('rs-'+cid).value.trim();if(!rs)return toast('Укажите причину решения');
 const f=calc(id).s,old=val(id,cid);S.ov[k]={nv,reason:rs};S.ap[k].st='done';S.log.push({id,cid,old,nv,f,t:calc(id).s,rs});render()}
function evalView(){
 const r=recs[S.sel],id=r.conversation_id,T=r.transcript,{s,d}=calc(id),fl=val(id,'critical'),t0=sec(T[0].timestamp);
 const list=recs.map((x,i)=>`<div onclick="pick(${i})" class="g p-3 mb-2 cursor-pointer ${i==S.sel?'hl':''}"><div class="flex justify-between text-sm font-semibold"><span>${esc(x.conversation_id)}</span><span class="text-[#00e08f]">${calc(x.conversation_id).s??'—'}</span></div><div class="text-[11px] text-slate-400">${x.channel=='voice call'?'📞':'💬'} ${x.channel} · ${x.language}</div></div>`).join('');
 const pl=r.channel=='voice call'?(r.audio_url?`<audio id="au" controls src="${esc(r.audio_url)}" class="w-full mb-3"></audio>`:`<div class="g p-3 mb-3 text-xs text-slate-400">🎧 В демо-данных audio_url пуст. Если ссылка есть, здесь появится плеер, а клик по таймкоду перемотает запись.</div>`):'';
 const tr=T.map((m,i)=>`<div id="t${i+1}" class="turn p-3 rounded-xl mb-2 text-sm transition-all duration-300 ${m.speaker=='operator'?'bg-[#00a36c14]':m.speaker=='client'?'bg-white/5':'bg-white/[.02] text-slate-400 italic'}"><div class="text-[11px] text-slate-400 mb-1"><b>${m.speaker}</b> · <span class="underline cursor-pointer" onclick="seek(${sec(m.timestamp)-t0})">${tm(m.timestamp)}</span> · #${i+1}</div>${esc(m.text)}</div>`).join('');
 const cs=cfg.map(c=>{
  const x=S.res[id][c.id]||{v:null,why:'Нажмите «Применить» в настройках.',ev:[1],c:0},v=val(id,c.id),k=id+'|'+c.id,o=S.ov[k],a=S.ap[k],bad=c.t=='flag'&&v;
  const lab=v==null?'N/A':c.t=='scale'?v+' / '+Math.max(...c.st):v?'Да':'Нет',qt=T[x.ev[0]-1];
  const opts=(c.t=='scale'?c.st.map(n=>[n,n]):[[true,'Да'],[false,'Нет']].concat(c.na?[[null,'N/A']]:[])).map(p=>`<option value="${p[0]}" ${p[0]===v?'selected':''}>${p[1]}</option>`).join('');
  return `<div class="g p-3 mb-2 cursor-pointer" onclick="go(${x.ev[0]})"><div class="flex justify-between items-start gap-2"><div class="text-sm font-semibold">${esc(c.n)}</div><span class="px-2 rounded-lg text-xs font-bold ${bad?'bg-red-500/30 text-red-200':v==null?'bg-white/10':'bg-[#00A36C]/30 text-[#7dffc6]'}">${lab}</span></div>
  <div class="text-[11px] text-slate-400 my-1">вес ${c.w}${v==null||c.t=='flag'?'':' → '+(c.w/d*100).toFixed(1)+'%'} · <span class="text-[#00e08f]" title="Демо: условная уверенность эвристики">AI ${x.c}% match</span></div>
  ${o?`<div class="text-xs text-amber-300 mb-1">Было: ${fmt(x.v)} ➔ Стало: ${fmt(o.nv)} · ${esc(o.reason)}</div>`:''}
  <div class="text-xs mb-1">${esc(x.why)}</div>
  <div class="text-[11px] text-slate-400 italic mb-1">«${esc(qt?qt.text.slice(0,110):'')}»</div>
  <div class="flex flex-wrap gap-1 items-center">${x.ev.map(n=>`<span class="chip" onclick="event.stopPropagation();go(${n})">#${n}</span>`).join('')}${!a?`<button class="b o ml-auto" onclick="event.stopPropagation();appeal('${k}')">Оспорить</button>`:''}</div>
  ${a&&a.st=='draft'?`<div onclick="event.stopPropagation()" class="mt-2"><textarea id="ac-${c.id}" class="in" rows="2" placeholder="Почему оценка неверна?"></textarea><button class="b mt-1" onclick="sendAp('${k}')">Отправить апелляцию</button></div>`:''}
  ${a&&a.st=='pending'?`<div onclick="event.stopPropagation()" class="mt-2 p-2 rounded-lg bg-amber-400/10 text-xs"><b>Апелляция:</b> ${esc(a.txt)}<div class="flex gap-1 mt-2"><select id="sv-${c.id}" class="in w-24">${opts}</select><input id="rs-${c.id}" class="in" placeholder="Причина (обязательно)"></div><button class="b mt-1" onclick="decide('${k}')">Принять решение</button></div>`:''}
  ${a&&a.st=='done'?`<div class="text-[11px] text-emerald-300 mt-1">Апелляция рассмотрена</div>`:''}</div>`}).join('');
 const lg=S.log.filter(l=>l.id==id).map(l=>`<div class="text-xs mb-1"><b>${esc(cfg.find(c=>c.id==l.cid).n)}</b>: ${fmt(l.old)} ➔ ${fmt(l.nv)}${l.old===l.nv?' (подтверждено)':''}<br><span class="text-amber-300">Было: ${l.f} ➔ Стало: ${l.t}</span> · ${esc(l.rs)}</div>`).join('')||'<div class="text-xs text-slate-400">Изменений пока нет.</div>';
 return `<div class="grid lg:grid-cols-12 gap-4"><aside class="lg:col-span-2">${list}</aside>
 <section class="lg:col-span-5 max-h-[82vh] overflow-y-auto pr-1">${pl}${tr}</section>
 <section class="lg:col-span-5 max-h-[82vh] overflow-y-auto pr-1"><div class="g p-4 mb-2 flex items-center gap-4"><div class="w-24 h-24 rounded-full grid place-items-center shrink-0" style="background:conic-gradient(#00e08f ${s||0}%,#ffffff14 0)"><div class="w-[84px] h-[84px] rounded-full bg-[#0a1110] grid place-items-center text-xl font-bold">${s??'—'}</div></div><div class="text-sm">Итоговый балл из 100<div class="text-[11px] text-slate-400">N/A исключаются, вес перераспределяется</div></div></div>
 ${fl?'<div class="bg-red-500/20 border border-red-500/50 rounded-xl p-2 text-xs mb-2">⚠ Грубая ошибка отмечена отдельно, итог не обнуляется</div>':''}${cs}
 <div class="g p-3"><div class="text-sm font-semibold mb-2">Журнал изменений</div>${lg}</div></section></div>`}
function cfgView(){const tw=cfg.reduce((a,c)=>a+c.w,0);
 return `<div class="g p-5 max-w-4xl mx-auto"><h2 class="font-bold text-lg">Настройка чек-листа</h2><p class="text-xs text-slate-400 mb-4">Сумма весов: ${tw}. Баллы приводятся к 100. Для шкалы укажите ступени через запятую, для нового критерия — ключевые слова оператора.</p>
 <div class="grid grid-cols-12 gap-2 text-[11px] text-slate-400 mb-1"><span class="col-span-4">Название</span><span class="col-span-1">Тип</span><span class="col-span-2">Вес</span><span class="col-span-1">N/A</span><span class="col-span-3">Шкала / слова</span></div>
 ${cfg.map((c,i)=>`<div class="grid grid-cols-12 gap-2 items-center mb-2 text-sm"><input class="in col-span-4" value="${esc(c.n)}" oninput="cfg[${i}].n=this.value"><span class="col-span-1 text-[11px] text-slate-400">${c.kw!=null?'bool+':c.t}</span><input type="number" class="in col-span-2" value="${c.w}" ${c.t=='flag'?'disabled':''} oninput="cfg[${i}].w=+this.value"><label class="col-span-1 text-xs"><input type="checkbox" ${c.na?'checked':''} onchange="cfg[${i}].na=this.checked"></label>
 <input class="in col-span-3" ${c.st?`value="${c.st}" oninput="cfg[${i}].st=this.value.split(',').map(Number).filter(n=>!isNaN(n))"`:c.kw!=null?`value="${esc(c.kw)}" oninput="cfg[${i}].kw=this.value"`:'disabled'}>
 <span class="col-span-1">${c.kw!=null?`<button class="b o" onclick="delCrit(${i})">✕</button>`:''}</span></div>`).join('')}
 <div class="grid grid-cols-12 gap-2 mt-4 pt-4 border-t border-white/10"><input id="nn" class="in col-span-4" placeholder="Новый критерий"><input id="nk" class="in col-span-4" placeholder="Слова: гарантия, риск"><input id="nw" type="number" class="in col-span-2" placeholder="Вес" value="10"><button class="b col-span-2" onclick="addCrit()">Добавить</button></div>
 <button class="b mt-5" onclick="applyCfg()">Применить ко всем диалогам</button></div>`}
function addCrit(){const n=$('nn').value.trim();if(!n)return toast('Введите название');cfg.push({id:'c'+Date.now(),n,t:'bool',w:+$('nw').value||10,na:false,kw:$('nk').value});render();toast('Добавлено. Нажмите «Применить»')}
function delCrit(i){cfg.splice(i,1);render()}
function applyCfg(){evalAll();S.tab='eval';render();toast('Пересчитано диалогов: '+recs.length)}
function render(){['eval','cfg'].forEach(t=>$('tb-'+t).className='b'+(S.tab==t?'':' o'));$('app').innerHTML=S.tab=='eval'?evalView():cfgView()}
function importJ(e){const f=e.target.files[0];if(!f)return;f.text().then(t=>{const j=JSON.parse(t),rs=((j.data||j).records)||[];recs=recs.concat(rs);evalAll();render();toast('Загружено: '+rs.length)}).catch(()=>toast('Неверный формат JSON'))}
function exportJ(){const results=recs.map(r=>{const id=r.conversation_id;return{conversation_id:id,status:'ok',criteria:cfg.filter(c=>c.kw==null).map(c=>{const x=S.res[id][c.id];return{criterion_id:c.id,value:val(id,c.id),rationale:x.why,evidence_turns:x.ev}}),score:{final_score:calc(id).s,critical_flag:!!val(id,'critical')}}});
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({schema_version:'1.0',team_name:'ESKASESKA',model:{mode:'local',name:'rule-based-demo'},results},null,1)],{type:'application/json'}));a.download='results.json';a.click()}
evalAll();render();
</script></body></html>
