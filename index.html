<!DOCTYPE html>
<!--
  ЗАПУСК: сохраните как index.html и откройте двойным кликом в браузере (нужен интернет для Tailwind CDN).
  Авторизация не требуется. Данные апелляций хранятся в localStorage (кнопка «Сбросить демо» очищает их).
-->
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FREEDOM · CQA</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body{font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;background:#f4f6f5}
  .bar{width:100%;border-radius:2px;background:#d5dbd8;cursor:pointer;transition:background .15s}
  .bar.on{background:#1faa59}
  .line{border:1px solid transparent;transition:background .2s,border-color .2s}
  .line.cur{background:#eef9f2;border-color:#bfe6cf}
  .line.flash{animation:fl 1.6s ease}
  @keyframes fl{0%,60%{background:#fff4d6;border-color:#f2c75c}100%{}}
  :focus-visible{outline:2px solid #1faa59;outline-offset:2px}
</style>
</head>
<body class="text-slate-800">

<header class="bg-white border-b border-slate-200 sticky top-0 z-20">
  <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center gap-3">
    <div class="flex items-center gap-3 mr-auto">
      <div class="w-9 h-9 rounded-xl bg-[#1faa59] text-white grid place-items-center font-bold">F</div>
      <div>
        <div class="font-extrabold tracking-tight text-[#14803f] leading-none">FREEDOM</div>
        <div id="modTitle" class="text-sm text-slate-500"></div>
      </div>
    </div>
    <div id="dlgSwitch" class="flex bg-slate-100 rounded-xl p-1 text-sm"></div>
    <div id="langSwitch" class="flex bg-slate-100 rounded-xl p-1 text-sm"></div>
    <button id="resetBtn" class="text-sm text-slate-500 hover:text-slate-800 px-2"></button>
  </div>
</header>

<main class="max-w-7xl mx-auto p-4 grid lg:grid-cols-5 gap-4">
  <!-- Левая колонка -->
  <section class="lg:col-span-3 space-y-4">
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4">
      <h2 id="hAnalysis" class="font-semibold mb-3"></h2>
      <div class="flex items-center gap-3">
        <button id="playBtn" class="w-11 h-11 shrink-0 rounded-full bg-[#1faa59] hover:bg-[#14803f] text-white grid place-items-center text-lg" aria-label="Play/Pause">▶</button>
        <div id="wave" class="flex-1 h-14 flex items-center gap-[2px]"></div>
        <div id="clock" class="text-sm tabular-nums text-slate-600 w-28 text-right"></div>
      </div>
      <div id="meta" class="text-xs text-slate-500 mt-2"></div>
    </div>
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4">
      <h2 id="hTranscript" class="font-semibold mb-3"></h2>
      <div id="transcript" class="space-y-2 max-h-[520px] overflow-y-auto pr-1"></div>
    </div>
  </section>

  <!-- Правая колонка -->
  <section class="lg:col-span-2 space-y-4">
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
      <div class="flex items-start justify-between gap-3">
        <div>
          <h2 id="hQuality" class="font-semibold"></h2>
          <div id="statusBadge" class="inline-block mt-2 text-xs px-2.5 py-1 rounded-full"></div>
        </div>
        <div class="text-right">
          <div class="text-5xl font-extrabold text-[#14803f] tabular-nums leading-none"><span id="total"></span><span class="text-xl text-slate-400 font-semibold"> / 100</span></div>
          <div id="aiNote" class="text-xs text-slate-500 mt-2"></div>
        </div>
      </div>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
      <h3 id="hAI" class="font-semibold mb-3"></h3>
      <div id="criteria" class="space-y-3"></div>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
      <h3 id="hExplain" class="font-semibold mb-3"></h3>
      <div id="explain" class="space-y-3"></div>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
      <h3 id="hHuman" class="font-semibold mb-2"></h3>
      <div id="humanBox" class="text-sm text-slate-600 mb-3"></div>
      <button id="appealBtn" class="w-full rounded-xl border border-[#1faa59] text-[#14803f] hover:bg-[#eef9f2] font-medium py-2.5"></button>
    </div>
  </section>
</main>

<!-- Модальное окно апелляции -->
<div id="modal" class="hidden fixed inset-0 z-30 bg-slate-900/40 grid place-items-center p-4">
  <div class="bg-white rounded-xl shadow-xl w-full max-w-md p-6">
    <h3 id="mTitle" class="text-lg font-semibold mb-4"></h3>
    <label id="mScoreL" class="text-sm text-slate-600"></label>
    <input id="mScore" type="number" min="0" max="100" step="0.5" class="w-full mt-1 mb-3 rounded-xl border border-slate-300 px-3 py-2">
    <label id="mDecL" class="text-sm text-slate-600"></label>
    <select id="mDec" class="w-full mt-1 mb-3 rounded-xl border border-slate-300 px-3 py-2"></select>
    <label id="mComL" class="text-sm text-slate-600"></label>
    <textarea id="mCom" rows="4" class="w-full mt-1 rounded-xl border border-slate-300 px-3 py-2"></textarea>
    <div id="mErr" class="text-sm text-red-600 min-h-[1.25rem]"></div>
    <div class="flex justify-end gap-2 mt-2">
      <button id="mCancel" class="px-4 py-2 rounded-xl text-slate-600 hover:bg-slate-100"></button>
      <button id="mSave" class="px-4 py-2 rounded-xl bg-[#1faa59] hover:bg-[#14803f] text-white font-medium"></button>
    </div>
  </div>
</div>

<script>
const T = {
  ru:{mod:'Рабочее место контроля качества',an:'Анализ разговора',tr:'Расшифровка',q:'Оценка качества',ai:'Контур ИИ · автоматическая оценка',ex:'Объяснение',hu:'Контур человека · ручной пересмотр',
      go:'Перейти к фрагменту',appeal:'Оспорить оценку',reset:'Сбросить демо',op:'Оператор',cl:'Клиент',aiOnly:'Оценка ИИ',human:'Пересмотрено проверяющим',
      noAppeal:'Оценка ИИ пока не оспаривалась.',mT:'Пересмотр оценки',mS:'Итоговый балл (0–100)',mD:'Решение',mC:'Комментарий проверяющего',
      d1:'Оставить оценку ИИ',d2:'Изменить балл',save:'Зафиксировать решение',cancel:'Отмена',err:'Введите балл от 0 до 100 и комментарий.',aiScore:'Балл ИИ',
      fin:'Финальное решение',by:'Проверяющий',call:'Звонок',chat:'Чат',noIssue:'Замечаний нет',time:'Хронология',noEx:'Критичных замечаний нет.'},
  kk:{mod:'Сапаны бақылау жұмыс орны',an:'Сөйлесуді талдау',tr:'Транскрипт',q:'Сапаны бағалау',ai:'ЖИ контуры · автоматты бағалау',ex:'Түсіндірме',hu:'Адам контуры · қолмен қайта қарау',
      go:'Үзіндіге өту',appeal:'Бағаға дау айту',reset:'Демоны тазалау',op:'Оператор',cl:'Клиент',aiOnly:'ЖИ бағасы',human:'Тексерушінің қайта қарауы',
      noAppeal:'ЖИ бағасына әлі дау айтылмаған.',mT:'Бағаны қайта қарау',mS:'Қорытынды балл (0–100)',mD:'Шешім',mC:'Тексерушінің пікірі',
      d1:'ЖИ бағасын қалдыру',d2:'Баллды өзгерту',save:'Шешімді бекіту',cancel:'Болдырмау',err:'0–100 аралығында балл мен пікір енгізіңіз.',aiScore:'ЖИ баллы',
      fin:'Түпкілікті шешім',by:'Тексеруші',call:'Қоңырау',chat:'Чат',noIssue:'Ескертпе жоқ',time:'Хронология',noEx:'Маңызды ескертпелер жоқ.'},
  en:{mod:'Quality Control Workspace',an:'Conversation analysis',tr:'Transcript',q:'Quality score',ai:'AI loop · automatic scoring',ex:'Explanation',hu:'Human loop · manual review',
      go:'Go to fragment',appeal:'Dispute score',reset:'Reset demo',op:'Agent',cl:'Customer',aiOnly:'AI score',human:'Reviewed by a human',
      noAppeal:'The AI score has not been disputed yet.',mT:'Score review',mS:'Final score (0–100)',mD:'Decision',mC:'Reviewer comment',
      d1:'Keep AI score',d2:'Change score',save:'Save decision',cancel:'Cancel',err:'Enter a score from 0 to 100 and a comment.',aiScore:'AI score',
      fin:'Final decision',by:'Reviewer',call:'Call',chat:'Chat',noIssue:'No issues',time:'Timeline',noEx:'No critical issues.'}
};

const DIALOGS = {
  call:{dur:393, t0:138, kind:'call', lines:[
    [0,'op','Добрый день, Freedom Finance, меня зовут Айгерим. Чем могу помочь?','Қайырлы күн, Freedom Finance, менің атым Айгерім. Қалай көмектесе аламын?','Good afternoon, Freedom Finance, this is Aigerim. How can I help?'],
    [12,'cl','Здравствуйте. Я отправил перевод за границу, но деньги до сих пор не пришли.','Сәлеметсіз бе. Шетелге аударым жібердім, бірақ ақша әлі келмеді.','Hello. I sent a transfer abroad, but the money still has not arrived.'],
    [35,'op','Понимаю. Назовите, пожалуйста, номер операции.','Түсінемін. Операция нөмірін айтыңызшы.','I understand. Could you give me the operation number?'],
    [70,'cl','Номер 48215. Он в статусе «в обработке» уже три дня.','Нөмірі 48215. Ол үш күннен бері «өңделуде» мәртебесінде.','It is 48215. It has been "processing" for three days.'],
    [138,'op','Перевод на проверке. Ваш запрос передан в обработку, мы с вами свяжемся.','Аударым тексеруде. Сұрауыңыз өңдеуге берілді, сізбен хабарласамыз.','The transfer is under review. Your request is passed on and we will contact you.'],
    [152,'cl','А когда примерно? Деньги нужны сегодня.','Шамамен қашан? Ақша бүгін керек.','Roughly when? I need the money today.'],
    [175,'op','Всего доброго.','Сау болыңыз.','Goodbye.']],
   crit:[
    {n:['Приветствие','Сәлемдесу','Greeting'],s:10,m:10},
    {n:['Выявление потребности','Қажеттілікті анықтау','Needs discovery'],s:15,m:15},
    {n:['Консультация','Консультация','Consultation'],s:15,m:20,line:4,
     x:['Срок ответа не уточнён: клиенту не назвали, когда будет результат проверки.','Жауап мерзімі нақтыланбады: тексеру нәтижесі қашан болатыны айтылмады.','Response time was not specified: the customer was not told when the review would finish.']},
    {n:['Ведение диалога','Диалог жүргізу','Dialogue handling'],s:10.5,m:15,line:5,
     x:['Вопрос клиента о сроках остался без ответа.','Клиенттің мерзім туралы сұрағы жауапсыз қалды.','The customer’s question about timing went unanswered.']},
    {n:['Соблюдение регламента','Регламентті сақтау','Compliance'],s:30,m:30},
    {n:['Завершение','Аяқтау','Closing'],s:0,m:5,line:6,
     x:['Нет итога разговора и предложения дополнительной помощи.','Әңгіме қорытындысы мен қосымша көмек ұсынылмады.','No summary of the call and no offer of further help.']},
    {n:['Тон и вежливость','Тон және сыпайылық','Tone and courtesy'],s:5,m:5}]},
  chat:{dur:312, t0:96, kind:'chat', lines:[
    [0,'cl','Не могу войти в приложение, пишет «неверный пароль».','Қолданбаға кіре алмай тұрмын, «құпиясөз қате» деп жазады.','I cannot log in to the app, it says "wrong password".'],
    [18,'op','Здравствуйте! Сейчас помогу. Вы пробовали восстановить пароль?','Сәлеметсіз бе! Қазір көмектесемін. Құпиясөзді қалпына келтіріп көрдіңіз бе?','Hello! I will help. Have you tried resetting the password?'],
    [41,'cl','Да, но SMS с кодом не приходит.','Иә, бірақ кодпен SMS келмейді.','Yes, but the SMS code never arrives.'],
    [96,'op','Для проверки отправьте номер карты и CVV прямо в чат.','Тексеру үшін карта нөмірі мен CVV-ді чатқа жіберіңіз.','To verify you, send the card number and CVV right here in the chat.'],
    [120,'cl','Хорошо... а это безопасно?','Жақсы... бұл қауіпсіз бе?','Okay... is that safe?'],
    [150,'op','Я передал заявку в техподдержку, SMS заработает в течение часа. Нужна ли ещё помощь?','Өтінімді техқолдауға бердім, SMS бір сағат ішінде жұмыс істейді. Тағы көмек керек пе?','I sent a ticket to tech support; SMS will work within an hour. Anything else I can help with?']],
   crit:[
    {n:['Приветствие','Сәлемдесу','Greeting'],s:10,m:10},
    {n:['Выявление потребности','Қажеттілікті анықтау','Needs discovery'],s:12,m:15,line:1,
     x:['Не уточнена причина: не выяснено, на каком шаге не приходит SMS.','Себебі нақтыланбады: SMS қай қадамда келмейтіні анықталмады.','Cause not clarified: the step where the SMS fails was not identified.']},
    {n:['Консультация','Консультация','Consultation'],s:18,m:20},
    {n:['Ведение диалога','Диалог жүргізу','Dialogue handling'],s:15,m:15},
    {n:['Соблюдение регламента','Регламентті сақтау','Compliance'],s:25,m:30,line:3,
     x:['Нарушение безопасности: оператор запросил CVV в открытом чате.','Қауіпсіздікті бұзу: оператор ашық чатта CVV сұрады.','Security breach: the agent requested a CVV in an open chat.']},
    {n:['Завершение','Аяқтау','Closing'],s:5,m:5},
    {n:['Тон и вежливость','Тон және сыпайылық','Tone and courtesy'],s:5,m:5}]}
};

const LANGS={ru:'Русский',kk:'Қазақша',en:'English'}, LI={ru:2,kk:3,en:4}; // индексы строк в массивах
const KEY='cqa_appeals_v1';
let lang='ru', dk='call', time=DIALOGS.call.t0, playing=false, timer=null;
const $=id=>document.getElementById(id), t=k=>T[lang][k];
const li={ru:0,kk:1,en:2}, nm=o=>o[li[lang]];
const load=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){return {}}};
const save=o=>{try{localStorage.setItem(KEY,JSON.stringify(o))}catch(e){}};
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(Math.floor(s%60)).padStart(2,'0');
const aiTotal=d=>d.crit.reduce((a,c)=>a+c.s,0);
const D=()=>DIALOGS[dk];
const curLine=()=>{let r=0;D().lines.forEach((l,i)=>{if(time>=l[0])r=i});return r};

function waveBars(){
  const n=90,els=[];let seed=dk==='call'?7:21;
  for(let i=0;i<n;i++){seed=(seed*9301+49297)%233280;const h=16+Math.round((seed/233280)*84*Math.abs(Math.sin(i/6)+.3));
    els.push(`<div class="bar" data-i="${i}" style="height:${Math.min(h,100)}%"></div>`)}
  $('wave').innerHTML=els.map(e=>`<div class="flex-1 h-full flex items-center">${e}</div>`).join('');
  document.querySelectorAll('.bar').forEach(b=>b.onclick=()=>{time=Math.round(b.dataset.i/90*D().dur);tick()});
}
function tick(){
  const d=D(),p=time/d.dur*90;
  document.querySelectorAll('.bar').forEach(b=>b.classList.toggle('on',+b.dataset.i<p));
  $('clock').textContent=fmt(time)+' / '+fmt(d.dur);
  const c=curLine();
  document.querySelectorAll('.line').forEach(el=>el.classList.toggle('cur',+el.dataset.i===c));
}
function renderTranscript(){
  $('transcript').innerHTML=D().lines.map((l,i)=>`
   <button data-i="${i}" class="line w-full text-left rounded-xl p-3 flex gap-3">
     <span class="text-xs tabular-nums text-slate-400 pt-0.5 w-10 shrink-0">${fmt(l[0])}</span>
     <span><span class="text-xs font-semibold ${l[1]==='op'?'text-[#14803f]':'text-slate-500'}">${t(l[1])}</span>
     <span class="block text-sm text-slate-800">${l[LI[lang]]}</span></span></button>`).join('');
  document.querySelectorAll('.line').forEach(b=>b.onclick=()=>{time=D().lines[+b.dataset.i][0];tick()});
}
function jump(i){
  const el=document.querySelector(`.line[data-i="${i}"]`);
  time=D().lines[i][0];tick();
  el.scrollIntoView({behavior:'smooth',block:'center'});
  el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash');
}
function renderScore(){
  const d=D(),a=load()[dk],ai=aiTotal(d);
  $('total').textContent=(a?a.score:ai).toString();
  $('statusBadge').className='inline-block mt-2 text-xs px-2.5 py-1 rounded-full '+(a?'bg-amber-100 text-amber-800':'bg-slate-100 text-slate-600');
  $('statusBadge').textContent=a?t('human'):t('aiOnly');
  $('aiNote').textContent=a?`${t('aiScore')}: ${ai}`:'';
  $('humanBox').innerHTML=a?`<div class="rounded-xl bg-slate-50 p-3 space-y-1">
     <div><b>${t('fin')}:</b> ${a.decision==='keep'?t('d1'):t('d2')} · ${a.score}/100</div>
     <div>${t('by')}: ${a.comment.replace(/</g,'&lt;')}</div>
     <div class="text-xs text-slate-400">${new Date(a.ts).toLocaleString()}</div></div>`:t('noAppeal');
}
function renderCriteria(){
  const d=D();
  $('criteria').innerHTML=d.crit.map(c=>{
    const r=c.s/c.m,col=r===1?'#1faa59':r>=.7?'#e0a100':'#d9433b',st=r===1?'✓':'!';
    return `<div><div class="flex justify-between text-sm mb-1"><span><span style="color:${col}" class="font-bold">${st}</span> ${nm(c.n)}</span>
      <span class="tabular-nums font-medium">${c.s} / ${c.m}</span></div>
      <div class="h-2 rounded-full bg-slate-100"><div class="h-2 rounded-full" style="width:${r*100}%;background:${col}"></div></div></div>`}).join('');
  const bad=d.crit.filter(c=>c.x);
  $('explain').innerHTML=bad.length?bad.map(c=>`<div class="rounded-xl bg-slate-50 p-3">
     <div class="text-sm font-medium">${nm(c.n)} <span class="text-slate-400 font-normal">−${+(c.m-c.s).toFixed(1)}</span></div>
     <p class="text-sm text-slate-600 mt-1">${nm(c.x)}</p>
     <button data-l="${c.line}" class="goBtn mt-2 text-sm text-[#14803f] font-medium hover:underline">${t('go')} (${fmt(d.lines[c.line][0])})</button></div>`).join('')
     :`<p class="text-sm text-slate-500">${t('noEx')}</p>`;
  document.querySelectorAll('.goBtn').forEach(b=>b.onclick=()=>jump(+b.dataset.l));
}
function renderChrome(){
  $('modTitle').textContent=t('mod');
  $('hAnalysis').textContent=t('an');$('hTranscript').textContent=t('tr');$('hQuality').textContent=t('q');
  $('hAI').textContent=t('ai');$('hExplain').textContent=t('ex');$('hHuman').textContent=t('hu');
  $('appealBtn').textContent=t('appeal');$('resetBtn').textContent=t('reset');
  $('meta').textContent=D().kind==='call'?t('call')+' · '+fmt(D().dur):t('chat')+' · '+t('time')+' '+fmt(D().dur);
  const sw=(id,items,cur,fn)=>{$(id).innerHTML=items.map(([k,l])=>`<button data-k="${k}" class="px-3 py-1.5 rounded-lg ${k===cur?'bg-white shadow-sm font-medium text-[#14803f]':'text-slate-500'}">${l}</button>`).join('');
    $(id).querySelectorAll('button').forEach(b=>b.onclick=()=>fn(b.dataset.k))};
  sw('langSwitch',Object.entries(LANGS),lang,k=>{lang=k;document.documentElement.lang=k;renderAll()});
  sw('dlgSwitch',[['call','📞 '+t('call')],['chat','💬 '+t('chat')]],dk,k=>{dk=k;pause();time=D().t0;waveBars();renderAll()});
}
function renderAll(){renderChrome();renderTranscript();renderCriteria();renderScore();tick()}

function pause(){playing=false;clearInterval(timer);$('playBtn').textContent='▶'}
$('playBtn').onclick=()=>{
  if(playing)return pause();
  playing=true;$('playBtn').textContent='❚❚';
  timer=setInterval(()=>{time+=1;if(time>=D().dur){time=D().dur;pause()}
    const el=document.querySelector('.line.cur');tick();
    const n=document.querySelector('.line.cur');if(n&&n!==el)n.scrollIntoView({behavior:'smooth',block:'nearest'})},1000)};

// Апелляция
$('appealBtn').onclick=()=>{
  const a=load()[dk];
  $('mTitle').textContent=t('mT');$('mScoreL').textContent=t('mS');$('mDecL').textContent=t('mD');$('mComL').textContent=t('mC');
  $('mCancel').textContent=t('cancel');$('mSave').textContent=t('save');$('mErr').textContent='';
  $('mDec').innerHTML=`<option value="keep">${t('d1')}</option><option value="change">${t('d2')}</option>`;
  $('mDec').value=a?a.decision:'change';
  $('mScore').value=a?a.score:aiTotal(D());$('mCom').value=a?a.comment:'';
  $('modal').classList.remove('hidden');$('mCom').focus();
};
$('mDec').onchange=()=>{if($('mDec').value==='keep')$('mScore').value=aiTotal(D())};
const closeM=()=>$('modal').classList.add('hidden');
$('mCancel').onclick=closeM;
$('modal').onclick=e=>{if(e.target.id==='modal')closeM()};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM()});
$('mSave').onclick=()=>{
  const score=parseFloat($('mScore').value),comment=$('mCom').value.trim();
  if(isNaN(score)||score<0||score>100||!comment)return $('mErr').textContent=t('err');
  const all=load();all[dk]={score,comment,decision:$('mDec').value,ts:Date.now()};save(all);
  closeM();renderScore();
};
$('resetBtn').onclick=()=>{try{localStorage.removeItem(KEY)}catch(e){}renderScore()};

waveBars();renderAll();
</script>
</body>
</html>
